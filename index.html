<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras</title>

<style>
:root {
  --green: #6ab344;
  --danger: #d32f2f;
  --bg: #f5f5f5;
  --card: #ffffff;
  --border: #ddd;
}

* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
}

header {
  background: var(--green);
  color: white;
  padding: 14px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 12px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 6px;
}

input, select {
  border: 1px solid var(--border);
}

button {
  background: var(--green);
  border: none;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.form {
  display: grid;
  gap: 8px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 90px 130px;
  gap: 6px;
}

.category {
  background: var(--card);
  margin-top: 12px;
  border-radius: 8px;
  overflow: hidden;
}

.category h3 {
  margin: 0;
  padding: 10px;
  background: #eee;
  font-size: 15px;
}

ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
}

li.checked span {
  text-decoration: line-through;
  color: var(--danger);
}

span {
  flex: 1;
}

.delete {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🛒 Lista de Compras</header>

<div class="container">

  <div class="form">
    <input id="produto" placeholder="Produto">

    <div class="form-row">
      <input id="quantidade"
        type="number"
        inputmode="numeric"
        pattern="[0-9]*"
        step="1"
        min="1"
        placeholder="Qtd">

      <select id="unidade" onchange="ajustarUnidade()">
        <option value="un">un</option>
        <option value="cx">cx</option>
        <option value="pct">pct</option>
        <option value="kg">kg</option>
        <option value="g">g</option>
        <option value="L">L</option>
        <option value="ml">ml</option>
      </select>

      <select id="categoria">
        <option value="frutas">🍎 Frutas</option>
        <option value="verduras">🥬 Verduras</option>
        <option value="carnes">🥩 Carnes</option>
        <option value="laticinios">🧀 Lácteos</option>
        <option value="outros">📦 Outros</option>
      </select>
    </div>

    <!-- BOTÃO AGORA NO LUGAR CERTO -->
    <button onclick="add()">Adicionar item</button>
  </div>

  <div id="listas"></div>

</div>

<script>
const API_URL = "COLE_AQUI_SUA_URL_DO_APPS_SCRIPT";

const categorias = {
  frutas: "🍎 Frutas",
  verduras: "🥬 Verduras",
  carnes: "🥩 Carnes",
  laticinios: "🧀 Lácteos",
  outros: "📦 Outros"
};

let itens = [];

function ajustarUnidade() {
  const unidade = document.getElementById("unidade").value;
  const qtd = document.getElementById("quantidade");

  if (["kg","g","L","ml"].includes(unidade)) {
    qtd.step = "0.01";
  } else {
    qtd.step = "1";
    qtd.value = qtd.value ? Math.floor(qtd.value) : "";
  }
}

async function carregar() {
  const res = await fetch(API_URL);
  itens = await res.json();
  render();
}

function render() {
  const area = document.getElementById("listas");
  area.innerHTML = "";

  Object.keys(categorias).forEach(cat => {
    const lista = itens.filter(i => i.categoria === cat);
    if (!lista.length) return;

    lista.sort((a,b)=>{
      if (a.checked === b.checked)
        return a.produto.localeCompare(b.produto);
      return a.checked - b.checked;
    });

    const div = document.createElement("div");
    div.className = "category";
    div.innerHTML = `<h3>${categorias[cat]}</h3><ul></ul>`;
    const ul = div.querySelector("ul");

    lista.forEach(item => {
      const li = document.createElement("li");
      if (item.checked) li.classList.add("checked");

      li.innerHTML = `
        <input type="checkbox"
          ${item.checked ? "checked" : ""}
          onchange="toggle(${item.id}, ${!item.checked})">

        <span>${item.produto} (${item.quantidade} ${item.unidade})</span>

        <button class="delete" onclick="del(${item.id})">🗑️</button>
      `;
      ul.appendChild(li);
    });

    area.appendChild(div);
  });
}

async function add() {
  const produto = document.getElementById("produto").value.trim();
  const quantidade = document.getElementById("quantidade").value;
  const unidade = document.getElementById("unidade").value;
  const categoria = document.getElementById("categoria").value;

  if (!produto || !quantidade) {
    alert("Preencha o produto e a quantidade");
    return;
  }

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "add",
      produto,
      quantidade,
      unidade,
      categoria
    })
  });

  document.getElementById("produto").value = "";
  document.getElementById("quantidade").value = "";

  carregar();
}

async function toggle(id, checked) {
  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "toggle", id, checked })
  });
  carregar();
}

async function del(id) {
  if (!confirm("Excluir item?")) return;
  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "delete", id })
  });
  carregar();
}

ajustarUnidade();
carregar();
</script>

</body>
</html>
