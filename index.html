<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras</title>

<style>
:root {
  --green: #6ab344;
  --danger: #d32f2f;
  --bg: #f6f6f6;
  --card: #ffffff;
  --border: #ddd;
}

* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
}

header {
  background: var(--green);
  color: #fff;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 12px;
}

.form {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}

.form input, .form select {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
}

.form input {
  flex: 1;
}

.form button {
  background: var(--green);
  border: none;
  color: white;
  padding: 10px 14px;
  border-radius: 4px;
  cursor: pointer;
}

.category {
  background: var(--card);
  margin-bottom: 12px;
  border-radius: 6px;
  overflow: hidden;
}

.category h3 {
  margin: 0;
  padding: 10px;
  background: #eee;
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 6px;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  padding: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

li.checked span {
  text-decoration: line-through;
  color: var(--danger);
}

li span {
  flex: 1;
}

.actions button {
  background: none;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🛒 Lista de Compras</header>

<div class="container">

  <div class="form">
    <input id="nome" placeholder="Produto">
    <select id="categoria">
      <option value="frutas">🍎 Frutas</option>
      <option value="verduras">🥬 Verduras</option>
      <option value="carnes">🥩 Carnes</option>
      <option value="laticinios">🧀 Lácteos</option>
      <option value="outros">📦 Outros</option>
    </select>
    <button onclick="add()">+</button>
  </div>

  <div id="listas"></div>

</div>

<script>
const categorias = {
  frutas: { nome: "Frutas", icon: "🍎" },
  verduras: { nome: "Verduras", icon: "🥬" },
  carnes: { nome: "Carnes", icon: "🥩" },
  laticinios: { nome: "Lácteos", icon: "🧀" },
  outros: { nome: "Outros", icon: "📦" }
};

let itens = JSON.parse(localStorage.getItem("lista")) || [];

function salvar() {
  localStorage.setItem("lista", JSON.stringify(itens));
}

function render() {
  const area = document.getElementById("listas");
  area.innerHTML = "";

  for (let key in categorias) {
    const lista = itens.filter(i => i.cat === key);
    if (lista.length === 0) continue;

    lista.sort((a,b)=>{
      if (a.checked === b.checked)
        return a.nome.localeCompare(b.nome);
      return a.checked - b.checked;
    });

    const div = document.createElement("div");
    div.className = "category";

    div.innerHTML = `<h3>${categorias[key].icon} ${categorias[key].nome}</h3><ul></ul>`;
    const ul = div.querySelector("ul");

    lista.forEach((item, i) => {
      const index = itens.indexOf(item);
      const li = document.createElement("li");
      if (item.checked) li.classList.add("checked");

      li.innerHTML = `
        <input type="checkbox" ${item.checked ? "checked" : ""} onchange="toggle(${index})">
        <span>${item.nome}</span>
        <div class="actions">
          <button onclick="edit(${index})">✏️</button>
          <button onclick="del(${index})">🗑️</button>
        </div>
      `;
      ul.appendChild(li);
    });

    area.appendChild(div);
  }
}

function add() {
  const nome = document.getElementById("nome").value.trim();
  const cat = document.getElementById("categoria").value;
  if (!nome) return;

  itens.push({ nome, cat, checked: false });
  document.getElementById("nome").value = "";
  salvar();
  render();
}

function toggle(i) {
  itens[i].checked = !itens[i].checked;
  salvar();
  render();
}

function edit(i) {
  const n = prompt("Editar produto:", itens[i].nome);
  if (n) {
    itens[i].nome = n.trim();
    salvar();
    render();
  }
}

function del(i) {
  if (confirm("Excluir item?")) {
    itens.splice(i, 1);
    salvar();
    render();
  }
}

render();
</script>

</body>
</html>
